    padding:10px 20px; background:linear-gradient(180deg, #212c3e, var(--bar));
    border-bottom:3px solid var(--accent); box-shadow:0 4px 18px rgba(0,0,0,.35); }
  #bar img.logo { height:46px; width:auto; display:block; }
  #bar .titles { display:flex; flex-direction:column; line-height:1.15; }
  #bar .titles .t1 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  #bar .titles .t2 { font-size:20px; font-weight:800; }
  #bar .pill { margin-left:6px; background:rgba(255,106,0,.14); color:var(--accent2); border:1px solid rgba(255,106,0,.45);
    border-radius:999px; padding:4px 12px; font-size:13px; font-weight:700; white-space:nowrap; }
  #bar .sp { flex:1; }
  #bar button { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:999px;
    padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  #bar button:hover { border-color:var(--accent); color:var(--accent2); }

  /* ---------- grid ---------- */
  main { max-width:1500px; margin:0 auto; padding:22px 20px 40px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:18px; }
  .tile { position:relative; border-radius:12px; overflow:hidden; aspect-ratio:4/3; cursor:zoom-in;
    background:linear-gradient(110deg, #1f2937 8%, #2a3647 18%, #1f2937 33%); background-size:200% 100%;
    animation:shimmer 1.3s linear infinite; border:1px solid var(--line);
    box-shadow:0 6px 18px rgba(0,0,0,.35); transition:transform .18s ease, box-shadow .18s ease, border-color .18s; }
  .tile.loaded { animation:none; background:#111827; }
  .tile:hover { transform:translateY(-3px); border-color:var(--accent); box-shadow:0 12px 28px rgba(0,0,0,.5); }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .35s ease, transform .35s ease; }
  .tile.loaded img { opacity:1; }
  .tile:hover img { transform:scale(1.04); }
  .tile .cap { position:absolute; left:0; right:0; bottom:0; padding:22px 12px 9px; font-size:12px; font-weight:700;
    background:linear-gradient(0deg, rgba(0,0,0,.75), rgba(0,0,0,0)); display:flex; justify-content:space-between; }
  .tile .cap .zoom { color:var(--accent2); opacity:0; transition:opacity .18s; }
  .tile:hover .cap .zoom { opacity:1; }
  .tile.err { cursor:default; animation:none; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px; text-align:center; padding:16px; }
  @keyframes shimmer { to { background-position:-200% 0; } }

  #empty { display:none; margin:80px auto; text-align:center; color:var(--muted); }
  #empty img { height:90px; opacity:.5; margin-bottom:14px; }
  footer { text-align:center; color:#5b6678; font-size:12px; padding:0 0 24px; }

  /* ---------- lightbox ---------- */
  #lb { position:fixed; inset:0; z-index:50; display:none; background:rgba(6,9,15,.94); backdrop-filter:blur(6px); }
  #lb.on { display:block; }
  #lbTop { position:absolute; top:0; left:0; right:0; height:58px; display:flex; align-items:center; gap:12px;
    padding:0 18px; background:rgba(15,21,33,.85); border-bottom:1px solid var(--line); }
  #lbTop img.logo { height:34px; }
  #lbTop .count { font-weight:800; font-size:15px; }
  #lbTop .count span { color:var(--muted); font-weight:600; }
  #lbTop .sp { flex:1; }
  #lbTop a, #lbTop button { background:#2a3647; color:#fff; border:0; border-radius:999px; padding:8px 15px; font-size:13px;
    font-weight:700; text-decoration:none; cursor:pointer; }
  #lbTop a.dl { background:var(--accent); }
  #lbTop a:hover, #lbTop button:hover { filter:brightness(1.15); }
  #lbWrap { position:absolute; top:58px; bottom:96px; left:0; right:0; overflow:auto; display:flex; align-items:center; justify-content:center; }
  #lbImg { max-width:calc(100% - 140px); max-height:100%; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.6); cursor:zoom-in; user-select:none; }
  #lbWrap.zoom { display:block; }
  #lbWrap.zoom #lbImg { max-width:none; max-height:none; cursor:zoom-out; border-radius:0; }
  .nav { position:absolute; top:calc(50% - 20px); transform:translateY(-50%); width:52px; height:52px; border-radius:50%;
    border:1px solid var(--line); background:rgba(31,41,55,.85); color:#fff; font-size:28px; line-height:1; cursor:pointer; z-index:2; }
  .nav:hover { background:var(--accent); border-color:var(--accent); }
  #prev { left:18px; } #next { right:18px; }
  #strip { position:absolute; left:0; right:0; bottom:0; height:96px; display:flex; gap:8px; align-items:center; justify-content:center;
    padding:10px 16px; overflow-x:auto; background:rgba(15,21,33,.85); border-top:1px solid var(--line); }
  #strip img { height:64px; width:86px; object-fit:cover; border-radius:6px; opacity:.5; cursor:pointer; border:2px solid transparent; flex:none; }
  #strip img.cur { opacity:1; border-color:var(--accent); }
  #strip img:hover { opacity:.9; }

  @media (max-width:640px) {
    #bar { padding:8px 12px; gap:10px; } #bar img.logo { height:36px; } #bar .titles .t2 { font-size:16px; }
    #bar button { display:none; }
    main { padding:14px 12px 30px; } #grid { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
    #lbImg { max-width:100%; } .nav { width:42px; height:42px; font-size:22px; } #prev { left:6px; } #next { right:6px; }
    #lbTop .hide-sm { display:none; }
  }
</style>
</head>

    var i = part.indexOf("="); if (i < 0) return;
    var k = part.substring(0, i), v = part.substring(i + 1);
    try { v = decodeURIComponent(v.replace(/\+/g, "%20")); } catch (e) {}
    if (k === "w") out.w = v.trim();
    if (k === "p") out.p = v.split(/[|\r\n]+/).map(function (s) { return s.trim(); })
                          .filter(function (s) { return /^https:\/\//i.test(s); });
  });
  return out;
}
// A SharePoint "anyone" link opens a viewer page; adding download=1 returns the photo file itself.
function fileUrl(link) {
  if (/download=1/i.test(link)) return link;
  return link + (link.indexOf("?") >= 0 ? "&" : "?") + "download=1";
}

var photos = [], cur = 0;
var grid = document.getElementById("grid"), lb = document.getElementById("lb"),
    lbImg = document.getElementById("lbImg"), lbWrap = document.getElementById("lbWrap"),
    strip = document.getElementById("strip");

function build() {
  var d = readHash();
  photos = d.p.map(fileUrl);
  document.getElementById("wrt").textContent = d.w || "Ticket";
  document.title = (d.w ? d.w + " – " : "") + "D4 Photos";
  document.getElementById("stat").textContent = photos.length + (photos.length === 1 ? " photo" : " photos");
  document.getElementById("btnFirst").style.display = photos.length ? "" : "none";
  grid.innerHTML = ""; strip.innerHTML = ""; queue = [];
  document.getElementById("empty").style.display = photos.length ? "none" : "block";
  photos.forEach(function (src, i) {
    var t = document.createElement("div"); t.className = "tile";
    var img = document.createElement("img"); img.alt = "Photo " + (i + 1);
    queue.push({ img: img, tile: t, src: src, n: i + 1, tries: 0 });
    var cap = document.createElement("div"); cap.className = "cap";
    cap.innerHTML = "<span>Photo " + (i + 1) + " of " + photos.length + "</span><span class='zoom'>View ⤢</span>";
    t.appendChild(img); t.appendChild(cap);
    t.onclick = function () { if (!t.classList.contains("err")) open(i); };
    grid.appendChild(t);

    var s = document.createElement("img"); s.alt = ""; s.setAttribute("data-src", src);
    s.onclick = function () { cur = i; show(); };
    strip.appendChild(s);
  });
  pump();
}

// ---- Load photos 2 at a time, with retries (SharePoint can refuse many downloads at once) ----
var queue = [], active = 0, MAX_ACTIVE = 2, MAX_TRIES = 4;
function pump() {
  while (active < MAX_ACTIVE && queue.length) loadOne(queue.shift());
}
function loadOne(job) {
  active++;
  var done = false;
  var timer = setTimeout(function () { fail(); }, 45000);
  function finish() { if (done) return; done = true; clearTimeout(timer); active--; pump(); }
  function fail() {
    if (done) return;
    job.tries++;
    if (job.tries < MAX_TRIES) {
      finish();
      setTimeout(function () { queue.unshift(job); pump(); }, 1500 * job.tries);
    } else {
      job.tile.className = "tile err";
      job.tile.innerHTML = "Photo " + job.n + " could not load.<br>Reload the page to try again.";
      finish();
    }
  }
  job.img.onload = function () { job.tile.classList.add("loaded"); finish(); };
  job.img.onerror = fail;
  job.img.src = job.tries ? job.src + "&retry=" + job.tries : job.src;
}

function show() {
  lbWrap.classList.remove("zoom");
  lbImg.src = photos[cur];
  document.getElementById("lbCount").innerHTML = "Photo " + (cur + 1) + " <span>of " + photos.length + "</span>";
  document.getElementById("btnDl").href = photos[cur];
  var multi = photos.length > 1;
  document.getElementById("prev").style.display = multi ? "" : "none";
  document.getElementById("next").style.display = multi ? "" : "none";
  strip.style.display = multi ? "" : "none";
  lbWrap.style.bottom = multi ? "96px" : "0";
  Array.prototype.forEach.call(strip.children, function (el, j) { el.classList.toggle("cur", j === cur); });
  var c = strip.children[cur]; if (c && c.scrollIntoView) c.scrollIntoView({ block: "nearest", inline: "center" });
  if (multi && !queue.length && !active) [cur + 1, cur - 1].forEach(function (j) { var p = new Image(); p.src = photos[(j + photos.length) % photos.length]; });
}
function open(i) {
  cur = i; lb.classList.add("on");
  Array.prototype.forEach.call(strip.children, function (el) { var d = el.getAttribute("data-src"); if (d && !el.src) el.src = d; });
  show();
}
function close() { lb.classList.remove("on"); lbImg.src = ""; }
function step(d) { cur = (cur + d + photos.length) % photos.length; show(); }
function zoom() { lbWrap.classList.toggle("zoom"); }

document.getElementById("prev").onclick = function () { step(-1); };
document.getElementById("next").onclick = function () { step(1); };
document.getElementById("btnClose").onclick = close;
document.getElementById("btnZoom").onclick = zoom;
document.getElementById("btnFirst").onclick = function () { if (photos.length) open(0); };
lbImg.onclick = zoom;
lbWrap.addEventListener("click", function (e) { if (e.target === lbWrap) close(); });
document.addEventListener("keydown", function (e) {
  if (!lb.classList.contains("on")) return;
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "Escape") close();
});
var sx = null;
lbWrap.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
lbWrap.addEventListener("touchend", function (e) {
  if (sx === null || lbWrap.classList.contains("zoom")) return;
  var dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
});

window.addEventListener("hashchange", build);
build();
</script>
</body>
</html>
